<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能模拟交易系统 - {{ cfg.stock_name }}</title>
<style>
*, ::before, ::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0b1219; color: #d0d8e0;
  min-height: 100vh; padding: 16px;
}
.container { max-width: 1200px; margin: 0 auto; }

/* 顶栏 */
.header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px; background: linear-gradient(135deg, #152238, #1a2d45);
  border-radius: 10px; margin-bottom: 16px;
}
.header h1 { font-size: 20px; font-weight: 600; color: #e8edf2; }
.header h1 small { font-size: 13px; color: #7a8ea8; font-weight: 400; margin-left: 8px; }
.header-right { text-align: right; font-size: 12px; color: #7a8ea8; }
.header-right .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status.connected { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
.status.disconnected { background: #ef4444; box-shadow: 0 0 6px #ef444488; }

/* 卡片网格 */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.card {
  background: #152238; border-radius: 10px; padding: 16px 20px;
  border: 1px solid #1e334a;
}
.card-header { font-size: 11px; color: #6b7f94; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.price-card {
  grid-column: 1 / -1; background: linear-gradient(135deg, #152238, #1a2d45);
  padding: 20px 24px;
}

/* 价格展示 */
.price-row { display: flex; align-items: baseline; gap: 12px; }
.price-main { font-size: 42px; font-weight: 700; font-family: 'JetBrains Mono', 'Consolas', monospace; }
.price-change { font-size: 18px; font-weight: 600; font-family: 'Consolas', monospace; }
.up { color: #22c55e; }
.down { color: #ef4444; }
.neutral { color: #d0d8e0; }

.price-meta { display: flex; gap: 24px; margin-top: 10px; flex-wrap: wrap; }
.price-meta-item { font-size: 13px; }
.price-meta-item .label { color: #6b7f94; }
.price-meta-item .value { font-family: 'Consolas', monospace; color: #d0d8e0; font-weight: 500; margin-left: 4px; }

/* 账户摘要 */
.account-row { display: flex; gap: 16px; flex-wrap: wrap; }
.account-item { flex: 1; min-width: 100px; }
.account-item .label { font-size: 11px; color: #6b7f94; }
.account-item .value { font-size: 18px; font-weight: 600; font-family: 'Consolas', monospace; margin-top: 2px; }
.account-item .sub-value { font-size: 12px; color: #6b7f94; margin-top: -1px; }

/* 策略信号 */
.signal-badge {
  display: inline-block; padding: 4px 12px; border-radius: 4px;
  font-size: 13px; font-weight: 500; margin-top: 4px;
}
.signal-buy { background: #22c55e22; color: #22c55e; border: 1px solid #22c55e44; }
.signal-sell { background: #ef444422; color: #ef4444; border: 1px solid #ef444444; }
.signal-wait { background: #f59e0b22; color: #f59e0b; border: 1px solid #f59e0b44; }
.signal-info { background: #3b82f622; color: #3b82f6; border: 1px solid #3b82f644; }

/* 表格 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; padding: 6px 8px; color: #6b7f94; font-weight: 500;
  border-bottom: 1px solid #1e334a; font-size: 11px; text-transform: uppercase;
}
tbody td { padding: 6px 8px; border-bottom: 1px solid #1a2d45; font-family: 'Consolas', monospace; }
.buy { color: #22c55e; font-weight: 600; }
.sell { color: #ef4444; font-weight: 600; }

/* 配置面板 */
.config-toggle {
  background: #1a2d45; border: 1px solid #2a4058; color: #d0d8e0;
  padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
  transition: background 0.2s;
}
.config-toggle:hover { background: #2a4058; }
.config-panel {
  display: none; background: #152238; border-radius: 10px; padding: 16px 20px;
  margin-bottom: 12px; border: 1px solid #1e334a;
}
.config-panel.open { display: block; }
.config-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.config-field label { display: block; font-size: 11px; color: #6b7f94; margin-bottom: 4px; }
.config-field input {
  background: #0b1219; border: 1px solid #1e334a; color: #d0d8e0;
  padding: 6px 10px; border-radius: 6px; font-size: 14px; width: 140px;
}
.config-field input:focus { outline: none; border-color: #3b82f6; }
.btn-primary {
  background: #2563eb; border: none; color: #fff; padding: 7px 20px;
  border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background 0.2s;
}
.btn-primary:hover { background: #1d4ed8; }

/* 进度条 */
.progress-bar {
  height: 3px; border-radius: 2px; background: #1e334a; margin-top: 4px;
}
.progress-fill {
.trade-card { grid-column: 1 / -1; }
.trade-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.trade-input-group label { font-size: 11px; color: #6b7f94; display: block; margin-bottom: 2px; }
.trade-input-group input { background: #0b1219; border: 1px solid #1e334a; color: #d0d8e0; padding: 6px 10px; border-radius: 6px; font-size: 16px; width: 100px; }
.trade-quick-btns { display: flex; gap: 4px; }
.trade-quick-btns button { background: #1a2d45; border: 1px solid #2a4058; color: #d0d8e0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
.trade-quick-btns button:hover { background: #2a4058; }
.trade-actions { display: flex; gap: 8px; }
.btn-trade { padding: 8px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; transition: 0.2s; }
.btn-buy { background: #22c55e; color: #fff; }
.btn-buy:hover { background: #16a34a; }
.btn-sell { background: #ef4444; color: #fff; }
.btn-sell:hover { background: #dc2626; }
.trade-result { font-size: 13px; color: #6b7f94; margin-top: 4px; width: 100%; }

  height: 100%; border-radius: 2px; background: #3b82f6; transition: width 0.5s;
}

@media (max-width: 680px) {
  .grid { grid-template-columns: 1fr; }
  .price-main { font-size: 28px; }
  .price-meta { gap: 12px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- 顶栏 -->
  <div class="header">
    <div>
      <h1>&#x1f4c8; 智能模拟交易系统 <small>v1.0</small></h1>
      <div style="font-size:13px; color:#7a8ea8; margin-top:2px;">
        {{ cfg.stock_name }} ({{ cfg.stock_code }}) | 初始现金: {{ "{:,.0f}".format(cfg.initial_cash) }} HKD
      </div>
    </div>
    <div class="header-right">
      <div><span class="status disconnected" id="statusDot"></span><span id="connStatus">连接中...</span></div>
      <div style="margin-top:2px;" id="marketStatus"></div>
      <div style="margin-top:2px;" id="lastUpdate"></div>
    </div>
  </div>

  <!-- 配置 -->
  <button class="config-toggle" onclick="document.getElementById('configPanel').classList.toggle('open')">
    &#x2699; 配置
  </button>
  <div class="config-panel" id="configPanel">
    <div class="config-form">
      <div class="config-field">
        <label>初始现金 (HKD)</label>
        <input type="number" id="cfgCash" value="{{ cfg.initial_cash | int }}" min="1000" step="10000">
      </div>
      <div class="config-field">
        <label>股票代码</label>
        <input type="text" id="cfgCode" value="{{ cfg.stock_code }}">
      </div>
      <div class="config-field">
        <label>Futu Host</label>
        <input type="text" id="cfgHost" value="{{ cfg.futu_host }}">
      </div>
      <div class="config-field">
        <label>Futu Port</label>
        <input type="number" id="cfgPort" value="{{ cfg.futu_quote_port }}">
      </div>
      <button class="btn-primary" onclick="applyConfig()">应用</button>
      <button class="btn-primary" style="background:#dc2626;" onclick="resetAll()">重置</button>
    </div>
  </div>

    <!-- 手动交易 -->
  <div class="card trade-card">
    <div class="card-header">X 手动交易</div>
    <div class="trade-row">
      <div class="trade-input-group">
        <label>数量 (股) <span id="tradeMaxHint"></span></label>
        <input type="number" id="tradeShares" value="100" min="1">
      </div>
      <div class="trade-quick-btns">
        <button onclick="setTradePct(0.25)">25%</button>
        <button onclick="setTradePct(0.5)">50%</button>
        <button onclick="setTradePct(0.75)">75%</button>
        <button onclick="setTradePct(1.0)">全仓</button>
      </div>
      <div class="trade-actions">
        <button class="btn-trade btn-buy" onclick="manualBuy()">买入</button>
        <button class="btn-trade btn-sell" onclick="manualSell()">卖出</button>
      </div>
      <div class="trade-result" id="tradeResult"></div>
    </div>
  </div>
<!-- 行情 -->
  <div class="card price-card">
    <div class="price-row">
      <span class="price-main neutral" id="priceDisplay">--</span>
      <span class="price-change neutral" id="changeDisplay">--</span>
    </div>
    <div class="price-meta">
      <div class="price-meta-item"><span class="label">均价</span><span class="value" id="avgPrice">收集中...</span></div>
      <div class="price-meta-item"><span class="label">价差</span><span class="value" id="diffPrice">--</span></div>
      <div class="price-meta-item"><span class="label">止损线</span><span class="value" id="stopLoss">--</span></div>
      <div class="price-meta-item"><span class="label">基准进度</span><span class="value" id="avgProgress">--</span></div>
    </div>
  </div>

  <div class="grid">
    <!-- 账户 -->
    <div class="card">
      <div class="card-header">&#x1f4b0; 账户</div>
      <div class="account-row">
        <div class="account-item">
          <div class="label">现金</div>
          <div class="value" id="cashVal">--</div>
        </div>
        <div class="account-item">
          <div class="label">持仓</div>
          <div class="value" id="posVal">0</div>
          <div class="sub-value">成本 <span id="avgCost">--</span></div>
        </div>
        <div class="account-item">
          <div class="label">市值</div>
          <div class="value" id="mktVal">0.00</div>
        </div>
        <div class="account-item">
          <div class="label">总资产</div>
          <div class="value" id="totalVal">--</div>
        </div>
        <div class="account-item">
          <div class="label">盈亏 (PnL)</div>
          <div class="value" id="pnlVal">+0.00</div>
          <div class="sub-value" id="pnlPct">0.00%</div>
        </div>
      </div>
    </div>

    <!-- 策略 -->
    <div class="card">
      <div class="card-header">&#x1f3af; 策略信号</div>
      <div id="signalText" class="signal-badge signal-wait">等待基准时段...</div>
      <div style="margin-top:10px;">
        <div class="price-meta-item"><span class="label">最新交易</span></div>
        <div style="font-size:13px; color:#d0d8e0; margin-top:2px;" id="lastTrade">暂无</div>
      </div>
      <div style="margin-top:8px;">
        <div class="price-meta-item"><span class="label">今日交易笔数</span>
          <span class="value" id="tradeCount">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 交易记录 -->
  <div class="card">
    <div class="card-header">&#x1f4cb; 交易记录</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>时间</th><th>方向</th><th>股数</th><th>成交价</th>
          <th>金额</th><th>现金余额</th><th>持仓</th>
        </tr></thead>
        <tbody id="tradeTable"><tr><td colspan="8" style="text-align:center; color:#6b7f94;">暂无交易</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let statusCache = null;

async function fetchJSON(url, opts) {
  try {
    const r = await fetch(url, opts);
    return await r.json();
  } catch { return null; }
}

function fmt(num) { return num.toFixed ? num.toFixed(2) : num; }

function getClass(val) {
  if (!val || val === 0) return 'neutral';
  return val > 0 ? 'up' : 'down';
}

function updateUI(d) {
  if (!d) return;
  statusCache = d;

  // 连接状态
  const dot = document.getElementById('statusDot');
  const cs = document.getElementById('connStatus');
  if (d.conn_status === '已连接') {
    dot.className = 'status connected';
    cs.textContent = d.conn_status;
  } else {
    dot.className = 'status disconnected';
    cs.textContent = d.conn_status || '未连接';
  }
  document.getElementById('marketStatus').textContent = d.market_status || '';
  document.getElementById('lastUpdate').textContent = '更新: ' + (d.last_update || '');

  // 价格
  const priceEl = document.getElementById('priceDisplay');
  const changeEl = document.getElementById('changeDisplay');
  if (d.price) {
    const c = getClass(d.change_pct);
    priceEl.textContent = d.price_str;
    priceEl.className = 'price-main ' + c;
    changeEl.textContent = d.change_str;
    changeEl.className = 'price-change ' + c;
  }

  // 价格指标
  document.getElementById('avgPrice').textContent = d.avg_price_str;
  document.getElementById('diffPrice').textContent = d.diff_str;
  const slEl = document.getElementById('stopLoss');
  slEl.textContent = d.stop_loss_str;
  slEl.className = 'value ' + (d.diff < 0 && d.price ? 'down' : '');

  // 基准进度
  const progressEl = document.getElementById('avgProgress');
  if (d.in_avg_period) {
    const pct = Math.min(100, (d.avg_collected / d.avg_target) * 100);
    progressEl.innerHTML = d.avg_collected + '/' + d.avg_target +
      '<div class="progress-bar"><div class="progress-fill" style="width:'+pct.toFixed(0)+'%"></div></div>';
  } else {
    progressEl.textContent = '已锁定 (' + (d.avg_set_time || '') + ')';
  }

  // 账户
  document.getElementById('cashVal').textContent = d.cash_str;
  document.getElementById('posVal').textContent = d.position.toLocaleString();
  document.getElementById('avgCost').textContent = d.avg_cost != null ? d.avg_cost.toFixed(4) : '--';
  document.getElementById('mktVal').textContent = d.market_value_str;
  document.getElementById('totalVal').textContent = d.total_assets_str;

  const pnlEl = document.getElementById('pnlVal');
  pnlEl.textContent = d.pnl_str;
  pnlEl.className = 'value ' + getClass(d.pnl);
  const pnlPctEl = document.getElementById('pnlPct');
  pnlPctEl.textContent = d.pnl_pct_str;
  pnlPctEl.className = 'sub-value ' + getClass(d.pnl);

  // 策略信号
  const sigEl = document.getElementById('signalText');
  sigEl.textContent = d.signal || '等待...';
  sigEl.className = 'signal-badge';
  if (d.signal && d.signal.includes('买入')) sigEl.classList.add('signal-buy');
  else if (d.signal && d.signal.includes('止损')) sigEl.classList.add('signal-sell');
  else if (d.signal && d.signal.includes('等待')) sigEl.classList.add('signal-wait');
  else sigEl.classList.add('signal-info');

  // 最新交易
  document.getElementById('tradeCount').textContent = d.trade_count;
  if (d.trade_count > 0) {
    document.getElementById('lastTrade').textContent = '有 ' + d.trade_count + ' 笔交易 (见下方记录)';
  } else {
    document.getElementById('lastTrade').textContent = '暂无交易';
  }
}

async function refresh() {
  const d = await fetchJSON('/api/status');
  if (d) updateUI(d);
}

async function refreshTrades() {
  const trades = await fetchJSON('/api/trades');
  if (!trades || trades.length === 0) return;
  const tbody = document.getElementById('tradeTable');
  tbody.innerHTML = trades.slice().reverse().map(t => {
    const cls = t.action === '买入' ? 'buy' : 'sell';
    return '<tr><td>' + t.no + '</td><td>' + t.time + '</td>' +
      '<td class="' + cls + '">' + t.action + '</td>' +
      '<td>' + t.shares.toLocaleString() + '</td>' +
      '<td>' + t.price.toFixed(4) + '</td>' +
      '<td>' + t.amount.toFixed(2) + '</td>' +
      '<td>' + t.cash_after.toFixed(2) + '</td>' +
      '<td>' + t.pos_after.toLocaleString() + '</td></tr>';
  }).join('');
}

async function applyConfig() {
  const body = {};
  const cash = parseFloat(document.getElementById('cfgCash').value);
  if (cash > 0) body.cash = cash;
  const code = document.getElementById('cfgCode').value.trim();
  if (code) body.code = code;
  const host = document.getElementById('cfgHost').value.trim();
  if (host) body.futu_host = host;
  const port = parseInt(document.getElementById('cfgPort').value);
  if (port > 0) body.futu_port = port;

  const r = await fetchJSON('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (r && r.ok) {
    document.getElementById('configPanel').classList.remove('open');
    setTimeout(refresh, 500);
  }
}

async function resetAll() {
  if (!confirm('确认重置所有状态？')) return;
  await fetchJSON('/api/action/reset', { method: 'POST' });
  refresh();
  refreshTrades();
}

// 初始化

function setTradePct(pct) {
  const d = window._lastStatus;
  if (!d) return;
  const pos = d.position || 0;
  const shares = Math.max(1, Math.floor(pos * pct));
  document.getElementById('tradeShares').value = shares;
}
async function doTrade(action) {
  const shares = parseInt(document.getElementById('tradeShares').value) || 0;
  if (shares <= 0) { showTradeResult('请输入有效数量'); return; }
  const r = await fetchJSON('/api/trade/' + action, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({shares: shares}),
  });
  if (r && r.ok) {
    showTradeResult((action==='buy'?'买入':'卖出') + ' ' + shares + ' 股成功', true);
    refresh(); refreshTrades();
  } else {
    showTradeResult((r && r.error) || '操作失败');
  }
}
function manualBuy() { doTrade('buy'); }
function manualSell() { doTrade('sell'); }
function showTradeResult(msg, ok) {
  const el = document.getElementById('tradeResult');
  el.textContent = msg;
  el.style.color = ok ? '#22c55e' : '#ef4444';
  setTimeout(() => { el.textContent = ''; }, 3000);
}

setInterval(refresh, 1000);
setInterval(refreshTrades, 3000);
refresh();
refreshTrades();
</script>
</body>
</html>
